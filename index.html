<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tableau d'échange">
<meta name="description" content="Tableau d'échange questions/réponses entre professeurs et élèves — Club Réussir Ensemble">
<title>Tableau d'échange — Prof & Élèves</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   SYSTÈME DE DESIGN — « Ardoise & Cahier »
   Un tableau de classe (en-tête ardoise, craie) qui ouvre sur des
   pages de cahier d'écolier (papier crème, lignes réglées, marge
   rouge). Accent « stylo bleu » (bleu Bic) hérité de l'écosystème
   Club Réussir Ensemble pour les actions ; le vert sert aux
   corrections du professeur, comme un stylo de correction.
   ══════════════════════════════════════════════════════════════ */
:root{
  --board:#1e3d31; --board-dark:#142e24; --board-edge:#6b4a30;
  --chalk:#f6f2e6; --chalk-dim:#bcccc0;
  --paper:#faf5e9; --paper-card:#fffcf4; --rule:#e8dcc0;
  --marge:#b5433f; --marge-soft:#e7c9c3;
  --ink:#25303a; --ink-soft:#63707a;
  --stylo:#6366f1; --stylo-dark:#4f52e0; --stylo-tint:#eef1ff;
  --correction:#2f7d55; --correction-tint:#eaf6ee; --correction-dark:#215e3f;
  --cover-eleve:#c1602f; --cover-prof:#2f6b4f; --cover-admin:#233a5c;
  --danger:#ef4444; --danger-tint:#fdeceb;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding-bottom:24px}

/* ── En-tête « ardoise » ── */
.board-header{
  background:
    radial-gradient(ellipse at 18% 22%, rgba(255,255,255,.05), transparent 42%),
    radial-gradient(ellipse at 82% 70%, rgba(255,255,255,.04), transparent 38%),
    linear-gradient(180deg, var(--board) 0%, var(--board-dark) 100%);
  border-bottom:5px solid var(--board-edge);
  padding:22px 18px 18px;
  margin-bottom:18px;
  position:relative;
  overflow:hidden;
}
.board-header::after{
  content:'';
  position:absolute; inset:0;
  background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 7px);
  pointer-events:none;
}
.board-inner{max-width:684px;margin:0 auto;position:relative;z-index:1}
h1{
  font-family:'Caveat',cursive;
  font-weight:700;
  font-size:34px;
  line-height:1;
  color:var(--chalk);
  text-shadow:0 1px 0 rgba(0,0,0,.15);
  letter-spacing:.3px;
}
.subtitle{font-size:12px;color:var(--chalk-dim);margin-top:4px;font-weight:500;letter-spacing:.2px}
.craies{display:flex;gap:7px;margin-top:12px}
.craie{width:15px;height:8px;border-radius:3px;box-shadow:inset 0 -2px 2px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.2)}

/* ── Cartes génériques (page de cahier) ── */
.card{
  background:var(--paper-card);
  background-image:repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px);
  border-radius:var(--radius);
  padding:16px 16px 16px 30px;
  margin:0 0 14px;
  box-shadow:0 1px 3px rgba(30,20,10,.08);
  position:relative;
  border:1px solid #f0e8d4;
}
.card::before{
  content:'';
  position:absolute; top:10px; bottom:10px; left:16px;
  width:1.5px; background:var(--marge-soft);
}
.btn{padding:10px 16px;border-radius:9px;border:none;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,background .15s}
.btn-primary{background:var(--stylo);color:#fff}
.btn-primary:hover{background:var(--stylo-dark)}
.btn-green{background:var(--correction);color:#fff}
.btn-green:hover{background:var(--correction-dark)}
.btn-ghost{background:var(--stylo-tint);color:var(--stylo-dark)}
.btn-ghost:hover{background:#dfe3ff}
.btn-danger{background:var(--danger-tint);color:var(--danger)}
.btn-block{width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab-chip:focus-visible,.role-card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--stylo);outline-offset:2px}

input[type=text],input[type=password],select,textarea{padding:10px 12px;border:1.5px solid var(--rule);border-radius:9px;font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--stylo)}
textarea{resize:vertical;min-height:70px}
label.f-label{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:12px}

/* ── Écran de rôle : couvertures de cahier ── */
.role-grid{display:grid;grid-template-columns:1fr;gap:12px}
.role-card{
  border-radius:14px;padding:20px 18px 20px 26px;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  border:none; position:relative; overflow:hidden;
  box-shadow:0 2px 6px rgba(20,15,5,.16);
  transition:transform .15s, box-shadow .15s;
  color:#fff;
}
.role-card:hover{transform:translateY(-2px) rotate(-.15deg);box-shadow:0 6px 14px rgba(20,15,5,.22)}
.role-card::before{ /* reliure spirale */
  content:'';
  position:absolute; top:8px; bottom:8px; left:8px; width:2px;
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,.55) 0 3px, transparent 3px 9px);
}
.role-card::after{ /* coin corné */
  content:'';
  position:absolute; top:0; right:0; width:0; height:0;
  border-style:solid; border-width:0 22px 22px 0;
  border-color:transparent rgba(0,0,0,.16) transparent transparent;
}
.role-card:nth-child(1){background:linear-gradient(155deg,var(--cover-eleve),#a1501f)}
.role-card:nth-child(2){background:linear-gradient(155deg,var(--cover-prof),#1f5138)}
.role-card:nth-child(3){background:linear-gradient(155deg,var(--cover-admin),#152743)}
.role-emoji{font-size:26px;width:48px;height:48px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;backdrop-filter:blur(2px)}
.role-title{font-family:'Fraunces',serif;font-size:16.5px;font-weight:700;color:#fff}
.role-desc{font-size:12px;color:rgba(255,255,255,.82);margin-top:2px}

.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;gap:10px;flex-wrap:wrap}
.who-badge{font-size:11px;background:var(--stylo-tint);color:var(--stylo-dark);border-radius:20px;padding:5px 12px;font-weight:700}
.link-btn{background:none;border:none;color:var(--stylo);font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:underline}

/* ── Onglets classes : onglets de classeur ── */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0}
.tab-chip{
  flex-shrink:0;padding:9px 16px 8px;border:none;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:12.5px;
  background:#efe6cd;color:var(--ink-soft);white-space:nowrap;
  clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);
  margin-right:-4px;
}
.tab-chip.active{background:var(--paper-card);color:var(--stylo-dark);position:relative;z-index:1;box-shadow:0 -2px 4px rgba(20,15,5,.06)}

/* ── Fil de questions (entrées de cahier) ── */
.q-item{background:var(--paper-card)}
.q-item.locked{opacity:.65}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.q-mat{font-size:10px;font-weight:700;background:var(--stylo-tint);color:var(--stylo-dark);border-radius:5px;padding:3px 8px;text-transform:uppercase;letter-spacing:.3px}
.q-time{font-size:10.5px;color:#a8998a;font-family:'DM Mono',monospace}
.q-stamp{
  font-family:'Fraunces',serif;font-weight:700;font-size:10.5px;color:var(--correction);
  border:1.5px solid var(--correction);border-radius:5px;padding:1px 7px;
  transform:rotate(-4deg);letter-spacing:.4px;text-transform:uppercase;
}
.q-eleve{font-family:'Fraunces',serif;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px}
.q-text{font-size:13.5px;color:#3a4552;line-height:1.5;white-space:pre-wrap}
.q-lock-note{font-size:11px;color:#a8998a;margin-top:8px;font-style:italic}
.q-del-btn{background:none;border:none;color:var(--marge);font-size:14px;cursor:pointer;padding:3px 6px;border-radius:6px;line-height:1;flex-shrink:0}
.q-del-btn:hover{background:var(--danger-tint)}

.r-box{margin-top:10px;background:var(--correction-tint);border-radius:9px;padding:10px 12px;border-left:3px solid var(--correction)}
.r-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.r-prof{font-size:11.5px;font-weight:700;color:var(--correction-dark)}
.r-time{font-size:10px;color:#6b9080;font-family:'DM Mono',monospace}
.r-text{font-size:13px;color:#215e3f;line-height:1.45;white-space:pre-wrap}

.ans-form{margin-top:10px}
.ans-form textarea{min-height:44px;font-size:13px}
.ans-form .composer-send{margin-top:8px}

/* ── Composeur Clavier / Dessin ── */
.composer-tabs{display:flex;gap:6px;margin-bottom:8px}
.composer-tab{padding:6px 12px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;color:var(--ink-soft);font-weight:700;font-size:11.5px;cursor:pointer;font-family:'DM Sans',sans-serif}
.composer-tab.active{background:var(--stylo);color:#fff;border-color:var(--stylo)}
.draw-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.color-swatches{display:flex;gap:5px}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--rule);cursor:pointer;padding:0}
.size-btns{display:flex;gap:4px}
.size-btns button,.btn-mini{padding:5px 9px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;color:var(--ink-soft);font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.size-btns button:hover,.btn-mini:hover{background:#f5efdd}
.draw-board-frame{position:relative;border-radius:14px;padding:9px;background:linear-gradient(180deg, var(--board) 0%, var(--board-dark) 100%);border:1px solid var(--board-edge);box-shadow:0 3px 10px rgba(20,15,5,.2), inset 0 0 0 1px rgba(255,255,255,.03)}
.draw-board-frame::after{content:'';position:absolute;inset:9px;border-radius:8px;background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0 2px, transparent 2px 7px);pointer-events:none}
.draw-canvas{width:100%;height:380px;border-radius:8px;touch-action:none;background:#15181b;display:block;cursor:crosshair;position:relative;z-index:1}
.q-dessin-img,.r-dessin-img{max-width:100%;border-radius:9px;margin-top:8px;border:1px solid var(--rule);display:block}

/* ── Outils mathématiques : indice & puissance ── */
.math-tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.math-tools .btn-mini.active{background:var(--stylo);color:#fff;border-color:var(--stylo)}
.math-palette{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;padding:8px;background:#f5efdd;border-radius:9px;border:1.5px solid var(--rule)}
.math-key{width:32px;height:32px;border-radius:7px;border:1.5px solid var(--rule);background:#fff;font-family:'DM Mono',monospace;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.math-key:hover{background:var(--stylo-tint);border-color:var(--stylo)}
.math-key-close{color:var(--danger);font-weight:700;border-color:var(--danger-tint)}

/* ── Enregistrement audio ── */
.audio-rec{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1.5px solid var(--rule);border-radius:10px}
.audio-rec-btn{width:46px;height:46px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s}
.audio-rec-btn:active{transform:scale(.94)}
.audio-rec-btn.recording{animation:pulseRec 1.2s infinite}
@keyframes pulseRec{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 11px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.audio-rec-status{font-size:12px;color:var(--ink-soft);flex:1;line-height:1.4}
.audio-preview{margin-top:10px;display:none;align-items:center;gap:8px}
.audio-preview audio{flex:1;height:36px}
.q-audio,.r-audio{width:100%;height:36px;margin-top:8px;display:block}

.empty{text-align:center;padding:30px 14px;color:#a8998a;font-size:13px}

.fab-new{position:sticky;bottom:14px;display:flex;justify-content:center;margin-top:8px}

/* ── Auth screens ── */
.auth-box{max-width:420px;margin:24px auto 0}
.center{text-align:center;margin-top:10px}
.roster-hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px}

#screen{padding:0 18px}
@media(min-width:640px){.role-grid{grid-template-columns:1fr 1fr 1fr}}
@media(prefers-reduced-motion:reduce){.role-card,.btn{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="board-header">
    <div class="board-inner">
      <h1>Tableau d'échange</h1>
      <div class="subtitle">CLUB RÉUSSIR ENSEMBLE — QUESTIONS &amp; RÉPONSES PROF / ÉLÈVES</div>
      <div class="craies">
        <span class="craie" style="background:#f6f2e6"></span>
        <span class="craie" style="background:#f0c14b"></span>
        <span class="craie" style="background:#e8877a"></span>
        <span class="craie" style="background:#7fb8d8"></span>
        <span class="craie" style="background:#8fc9a1"></span>
      </div>
    </div>
  </div>
  <div id="screen"></div>
</div>

<!-- ══ FIREBASE SDK ══ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, getDocs, onSnapshot,
         addDoc, query, where, orderBy, deleteDoc, updateDoc
       } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYeYPOptN2wEak_Ctcr4a8t5qXpj4riLE",
  authDomain: "emploi-temps.firebaseapp.com",
  projectId: "emploi-temps",
  storageBucket: "emploi-temps.firebasestorage.app",
  messagingSenderId: "665985283894",
  appId: "1:665985283894:web:b0c4cb14824bb8fed9a597"
};
const fbApp = initializeApp(firebaseConfig);
const fbDB  = getFirestore(fbApp);

window.fbDB = fbDB;
window.fbDoc = doc; window.fbSetDoc = setDoc; window.fbGetDoc = getDoc;
window.fbCollection = collection; window.fbGetDocs = getDocs; window.fbOnSnapshot = onSnapshot;
window.fbAddDoc = addDoc; window.fbQuery = query; window.fbWhere = where; window.fbOrderBy = orderBy;
window.fbDeleteDoc = deleteDoc; window.fbUpdateDoc = updateDoc;
window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
// ═══════════════════════════════════════════════════════════════
// TABLEAU D'ÉCHANGE — Prof & Élèves (même projet Firebase que Emploi du temps)
// Collections utilisées :
//   - profs           (lecture seule, synchronisée depuis Emploi du temps)  {nom, matieres[]}
//   - edtxRoster       (lecture seule, synchronisée depuis Emploi du temps)  {name, eleves:[{id,name,prenom}]}
//   - edtxTableauCodes (créée ici, par l'admin)  {code, classeName, createdAt}  — doc id = id de la classe (edtxRoster)
//   - edtxTableau      (créée ici)  {classeId, classeName, matiere, eleveNom, question, createdAt, reponses:[{profNom,profCode,texte,createdAt}]}
// ═══════════════════════════════════════════════════════════════
const ADMIN_PASS = 'reussir2024'; // mot de passe admin — à changer si besoin

let fbReady = false;
window.addEventListener('fb-ready', ()=>{ fbReady = true; boot(); });

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){ if(!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function qs(k){ return new URLSearchParams(location.search).get(k); }
function screen(html){ document.getElementById('screen').innerHTML = html; }

// ═══════════════ Composeur Clavier / Dessin (réutilisable) ═══════════════
function composerHtml(prefix, placeholder){
  return `
    <div class="composer-tabs">
      <button type="button" class="composer-tab active" data-composer="${prefix}" data-mode="texte" onclick="switchComposerMode('${prefix}','texte')">⌨️ Clavier</button>
      <button type="button" class="composer-tab" data-composer="${prefix}" data-mode="dessin" onclick="switchComposerMode('${prefix}','dessin')">✏️ Dessin libre</button>
      <button type="button" class="composer-tab" data-composer="${prefix}" data-mode="audio" onclick="switchComposerMode('${prefix}','audio')">🎙️ Audio</button>
    </div>
    <div id="${prefix}-text-wrap">
      <textarea id="${prefix}-text" placeholder="${esc(placeholder)}"></textarea>
      <div class="math-tools">
        ${Object.keys(MATH_CATEGORIES).map(cat=>`<button type="button" class="btn-mini" id="${prefix}-mathbtn-${cat}" onclick="toggleMathPalette('${prefix}','${cat}')">${MATH_CATEGORIES[cat].short}</button>`).join('')}
      </div>
      <div id="${prefix}-mathpalette" class="math-palette" style="display:none"></div>
    </div>
    <div id="${prefix}-draw-wrap" style="display:none">
      <div class="draw-toolbar">
        <div class="color-swatches">
          ${['#f6f2e6','#f0c14b','#e8877a','#7fb8d8','#8fc9a1'].map((c,i)=>`<button type="button" class="swatch" style="background:${c}${i===0?';box-shadow:0 0 0 2px #6366f1':''}" onclick="setCanvasColor('${prefix}-canvas','${c}')" title="Couleur"></button>`).join('')}
        </div>
        <div class="size-btns">
          <button type="button" onclick="setCanvasSize('${prefix}-canvas',3)">Fin</button>
          <button type="button" onclick="setCanvasSize('${prefix}-canvas',6)">Moyen</button>
          <button type="button" onclick="setCanvasSize('${prefix}-canvas',14)">Épais</button>
        </div>
        <button type="button" class="btn-mini" onclick="undoCanvas('${prefix}-canvas')">↩️ Annuler</button>
        <button type="button" class="btn-mini" onclick="clearCanvas('${prefix}-canvas')">🗑️ Effacer</button>
      </div>
      <div class="draw-board-frame">
        <canvas id="${prefix}-canvas" width="800" height="500" class="draw-canvas"></canvas>
      </div>
    </div>
    <div id="${prefix}-audio-wrap" style="display:none">
      <div class="audio-rec">
        <button type="button" class="audio-rec-btn" id="${prefix}-audio-btn" onclick="toggleAudioRecording('${prefix}')">🎤</button>
        <span class="audio-rec-status" id="${prefix}-audio-status">Appuyez pour enregistrer un message vocal (60 s max)</span>
      </div>
      <div class="audio-preview" id="${prefix}-audio-preview"></div>
    </div>
  `;
}

window.switchComposerMode = function(prefix, mode){
  const textWrap = document.getElementById(prefix+'-text-wrap');
  const drawWrap = document.getElementById(prefix+'-draw-wrap');
  const audioWrap = document.getElementById(prefix+'-audio-wrap');
  if(textWrap) textWrap.style.display = mode==='texte' ? '' : 'none';
  if(drawWrap) drawWrap.style.display = mode==='dessin' ? '' : 'none';
  if(audioWrap) audioWrap.style.display = mode==='audio' ? '' : 'none';
  document.querySelectorAll(`[data-composer="${prefix}"]`).forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  if(mode==='dessin') initCanvas(prefix+'-canvas');
};

// ── Outils mathématiques : exposants, indices, opérateurs, symboles, fonctions ──
const MATH_CATEGORIES = {
  sup: { label:'Puissance', short:'xⁿ', items:['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹','⁺','⁻','ⁿ','ⁱ','ˣ','⁽','⁾'] },
  sub: { label:'Indice',    short:'xₙ', items:['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉','₊','₋','ₙ','ₐ','ₑ','ₓ','₍','₎'] },
  op:  { label:'Opérateurs',short:'±',  items:['×','÷','±','∓','≤','≥','≠','≈','∞','°','·'] },

function insertAtCursor(fieldId, text){
  const el = document.getElementById(fieldId);
  if(!el) return;
  const start = el.selectionStart!=null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd!=null ? el.selectionEnd : el.value.length;
  const val = el.value;
  el.value = val.slice(0,start) + text + val.slice(end);
  const pos = start + text.length;
  el.focus();
  el.setSelectionRange(pos,pos);
}

window.toggleMathPalette = function(prefix, cat){
  const pal = document.getElementById(prefix+'-mathpalette');
  if(!pal) return;
  const alreadyOpenSame = pal.style.display!=='none' && pal.dataset.cat===cat;
  if(alreadyOpenSame){ window.closeMathPalette(prefix); return; }
  const def = MATH_CATEGORIES[cat];

  pal.innerHTML = def.items.map(it=>

  ).join('') + `<button type="button" class="math-key math-key-close" title="Fermer" onclick="closeMathPalette('${prefix}')">✕</button>`;

// ── Enregistrement audio (message vocal) ──
const audioStates = {};

window.toggleAudioRecording = async function(prefix){
  const st = audioStates[prefix] || (audioStates[prefix] = {});
  if(st.recording){
    try{ st.recorder.stop(); }catch(e){}
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert("L'enregistrement audio n'est pas pris en charge par ce navigateur.");
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    st.stream = stream;
    st.chunks = [];
    const mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm')) ? 'audio/webm' : '';
    st.recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    st.recorder.ondataavailable = e => { if(e.data && e.data.size>0) st.chunks.push(e.data); };
    st.recorder.onstop = () => {
      st.recording = false;
      stream.getTracks().forEach(t=>t.stop());
      if(st.timerInt){ clearInterval(st.timerInt); st.timerInt = null; }
      const blob = new Blob(st.chunks, { type: (st.recorder && st.recorder.mimeType) || 'audio/webm' });
      const reader = new FileReader();
      reader.onloadend = () => {
        st.dataUrl = reader.result;
        renderAudioPreview(prefix);
        updateAudioBtn(prefix);
      };
      reader.readAsDataURL(blob);
    };
    st.recorder.start();
    st.recording = true;
    st.startedAt = Date.now();
    updateAudioBtn(prefix);
    st.timerInt = setInterval(()=>updateAudioTimer(prefix), 500);
  }catch(e){
    alert("Impossible d'accéder au microphone : " + (e && e.message ? e.message : e));
  }
};

function updateAudioBtn(prefix){
  const st = audioStates[prefix] || {};
  const btn = document.getElementById(prefix+'-audio-btn');
  const status = document.getElementById(prefix+'-audio-status');
  if(!btn) return;
  if(st.recording){
    btn.classList.add('recording'); btn.textContent = '⏹️';
    if(status) status.textContent = 'Enregistrement… (0 s) — touchez pour arrêter';
  }else{
    btn.classList.remove('recording'); btn.textContent = '🎤';
    if(status) status.textContent = st.dataUrl ? '✅ Message vocal prêt (réécoutez ci-dessous)' : 'Appuyez pour enregistrer un message vocal (60 s max)';
  }
}

function updateAudioTimer(prefix){
  const st = audioStates[prefix];
  if(!st || !st.recording) return;
  const status = document.getElementById(prefix+'-audio-status');
  const secs = Math.floor((Date.now()-st.startedAt)/1000);
  if(status) status.textContent = `Enregistrement… (${secs} s) — touchez pour arrêter`;
  if(secs >= 60){ try{ st.recorder.stop(); }catch(e){} }
}

function renderAudioPreview(prefix){
  const box = document.getElementById(prefix+'-audio-preview');
  if(!box) return;
  const st = audioStates[prefix];
  if(!st || !st.dataUrl){ box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'flex';
  box.innerHTML = `<audio controls src="${st.dataUrl}"></audio><button type="button" class="btn-mini" onclick="deleteAudioRecording('${prefix}')">🗑️ Supprimer</button>`;
}

window.deleteAudioRecording = function(prefix){
  const st = audioStates[prefix];
  if(st) st.dataUrl = null;
  renderAudioPreview(prefix);
  updateAudioBtn(prefix);
};

function audioHasContent(prefix){ const st = audioStates[prefix]; return !!(st && st.dataUrl); }
function audioToDataURL(prefix){ const st = audioStates[prefix]; return st ? st.dataUrl : null; }
function resetAudioState(prefix){
  const st = audioStates[prefix];
  if(st){ st.dataUrl = null; st.chunks = []; }
  renderAudioPreview(prefix);
  updateAudioBtn(prefix);
}

// ── Moteur de dessin à main libre (vectoriel, avec annuler/effacer) ──
const canvasStates = {};

function ptFromEvent(canvas, e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}

function redrawCanvas(canvasId){
  const st = canvasStates[canvasId];
  if(!st) return;
  const ctx = st.ctx, canvas = st.canvas;
  ctx.fillStyle = '#15181b';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  st.strokes.forEach(s=>{
    if(s.points.length < 2){
      ctx.beginPath();
      ctx.arc(s.points[0].x, s.points[0].y, s.size/2, 0, Math.PI*2);
      ctx.fillStyle = s.color;
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(s.points[0].x, s.points[0].y);
    for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  });
}

function initCanvas(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas || canvas.__inited) return;
  canvas.__inited = true;
  const ctx = canvas.getContext('2d');
  const st = { canvas, ctx, strokes: [], current: null, color: '#f6f2e6', size: 4 };
  canvasStates[canvasId] = st;
  redrawCanvas(canvasId);

  function down(e){
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    const p = ptFromEvent(canvas, e);
    st.current = { color: st.color, size: st.size, points: [p] };
    st.strokes.push(st.current);
    redrawCanvas(canvasId);
  }
  function move(e){
    if(!st.current) return;
    e.preventDefault();
    st.current.points.push(ptFromEvent(canvas, e));
    redrawCanvas(canvasId);
  }
  function up(){ st.current = null; }
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointerleave', up);
  canvas.addEventListener('pointercancel', up);
}

window.setCanvasColor = function(canvasId, color){ const st = canvasStates[canvasId]; if(st) st.color = color; };
window.setCanvasSize  = function(canvasId, size){ const st = canvasStates[canvasId]; if(st) st.size = size; };
window.undoCanvas = function(canvasId){ const st = canvasStates[canvasId]; if(st && st.strokes.length){ st.strokes.pop(); redrawCanvas(canvasId); } };
window.clearCanvas = function(canvasId){ const st = canvasStates[canvasId]; if(st){ st.strokes = []; redrawCanvas(canvasId); } };
function canvasHasContent(canvasId){ const st = canvasStates[canvasId]; return !!(st && st.strokes.length); }
function canvasToDataURL(canvasId){ const st = canvasStates[canvasId]; return st ? st.canvas.toDataURL('image/jpeg', 0.75) : null; }

  if(!box) return;
  if(!list.length){ box.innerHTML = `<div class="empty">💬 Aucune question dans cette classe pour l'instant.</div>`; return; }
  box.innerHTML = list.map(q=>renderQItem(q, {readonly:false, prof:s})).join('');
}

// ═══════════════ Rendu d'une question (commun élève/prof) ═══════════════
function renderQItem(q, opts){
  const reponses = q.reponses || [];
  const answered = reponses.length>0;
  const prof = opts.prof;
  const peutRepondre = !opts.readonly && prof && (prof.matieres||[]).includes(q.matiere) ;
  const peutSupprimerEleve = opts.eleve && opts.eleve.role==='eleve' && opts.eleve.eleveNom === q.eleveNom;
  const peutSupprimer = peutRepondre || peutSupprimerEleve;
  const reponsesHtml = reponses.map(r=>`
    <div class="r-box">
      <div class="r-top"><span class="r-prof">🧑‍🏫 ${esc(r.profNom)}</span><span class="r-time">${fmtTime(r.createdAt)}</span></div>
      ${r.texte ? `<div class="r-text">${esc(r.texte)}</div>` : ''}
      ${r.dessin ? `<img class="r-dessin-img" src="${r.dessin}" alt="Dessin de réponse">` : ''}
      ${r.audio ? `<audio class="r-audio" controls src="${r.audio}"></audio>` : ''}
    </div>`).join('');
  let ansFormHtml = '';
  if(peutRepondre){
    const ansPrefix = 'ans-'+q.id;
    ansFormHtml = `
      <div class="ans-form">
        ${composerHtml(ansPrefix,'Votre réponse...')}
        <button class="btn btn-primary btn-block composer-send" onclick="profRepondre('${q.id}')">Répondre</button>
      </div>`;
  } else if(!opts.readonly && !answered){
    ansFormHtml = `<div class="q-lock-note">🔒 Réservé à un professeur de ${esc(q.matiere)}.</div>`;
  }
  return `
    <div class="q-item ${answered?'answered':''}">
      <div class="q-top"><span class="q-mat">${esc(q.matiere)}</span>${answered?'<span class="q-stamp">Répondu ✓</span>':''}<span class="q-time">${fmtTime(q.createdAt)}</span>${peutSupprimer?`<button type="button" class="q-del-btn" onclick="supprimerQuestion('${q.id}')" title="Supprimer cette question">🗑️</button>`:''}</div>
      <div class="q-eleve">🎒 ${esc(q.eleveNom)}</div>
      ${q.question ? `<div class="q-text">${esc(q.question)}</div>` : ''}
      ${q.dessin ? `<img class="q-dessin-img" src="${q.dessin}" alt="Dessin de la question">` : ''}
      ${q.audio ? `<audio class="q-audio" controls src="${q.audio}"></audio>` : ''}
      ${reponsesHtml}
      ${ansFormHtml}
    </div>`;
}

window.profRepondre = async function(qId){
  const s = getSession();
  if(!s || s.role!=='prof') return;
  const prefix = 'ans-'+qId;
  const texte = (document.getElementById(prefix+'-text').value||'').trim();
  const dessin = canvasHasContent(prefix+'-canvas') ? canvasToDataURL(prefix+'-canvas') : null;
  const audio = audioHasContent(prefix) ? audioToDataURL(prefix) : null;
  if(!texte && !dessin && !audio){ alert('Veuillez écrire une réponse, faire un dessin ou enregistrer un message vocal.'); return; }
  try{
    const ref = window.fbDoc(window.fbDB,'edtxTableau', qId);
    const snap = await window.fbGetDoc(ref);
    if(!snap.exists()) return;
    const reponses = snap.data().reponses || [];
    reponses.push({ profNom: s.nom, profCode: s.code, texte: texte||'', dessin: dessin||null, audio: audio||null, createdAt: Date.now() });
    await window.fbUpdateDoc(ref, { reponses });
    resetAudioState(prefix);
  }catch(e){ alert('Erreur : ' + (e && e.message ? e.message : e)); }
};

window.supprimerQuestion = async function(qId){
  if(!confirm('Supprimer définitivement cette question (et ses réponses éventuelles) ?')) return;
  try{
    await window.fbDeleteDoc(window.fbDoc(window.fbDB,'edtxTableau', qId));
  }catch(e){ alert('Erreur de suppression : ' + (e && e.message ? e.message : e)); }
};

// ═══════════════ Écoute temps réel du tableau d'une classe ═══════════════
function ecouterTableauClasse(classeId, cb){
  if(unsubBoard) unsubBoard();
  const qy = window.fbQuery(window.fbCollection(window.fbDB,'edtxTableau'), window.fbWhere('classeId','==',classeId));
  unsubBoard = window.fbOnSnapshot(qy, snap=>{
    const list = snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    cb(list);
  }, err=>console.warn('tableau listener error', err));
}

// ── Lien d'installation de l'application (PWA) ──
function buildInstallLink(){
  return `${window.location.origin}${window.location.pathname}`;
}
window.copierLienInstall = function(){
  navigator.clipboard.writeText(buildInstallLink()).then(()=>alert("🔗 Lien d'installation copié !"));
};
function instructionsInstall(){
  return `1️⃣ Ouvrez ce lien dans votre navigateur (Chrome ou Safari)\n2️⃣ Appuyez sur le menu (⋮ ou 📤) puis « Ajouter à l'écran d'accueil » / « Installer l'application »\n3️⃣ L'icône « Tableau d'échange » apparaîtra sur votre téléphone, comme une vraie application !`;
}
window.partagerInstallWA = function(cible){
  const lien = buildInstallLink();
  const suite = cible==='eleve'
    ? `Ensuite, demandez le *code de votre classe* à votre professeur ou à l'administration pour vous connecter.`
    : `Connectez-vous ensuite avec votre *code professeur* habituel.`;
  const texte = `📲 Installez l'application *Tableau d'échange* sur votre téléphone :\n${lien}\n\n${instructionsInstall()}\n\n${suite}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(texte)}`, '_blank');
};
window.partagerInstallEmail = function(cible){
  const lien = buildInstallLink();
  const sujet = cible==='eleve' ? "Installer l'application Tableau d'échange (Élèves)" : "Installer l'application Tableau d'échange (Professeurs)";
  const suite = cible==='eleve'
    ? `Ensuite, demandez le code de votre classe à votre professeur ou à l'administration pour vous connecter.`
    : `Connectez-vous ensuite avec votre code professeur habituel.`;
  const corps = `Bonjour,\n\nVoici le lien pour installer l'application « Tableau d'échange » sur votre téléphone :\n${lien}\n\nComment l'installer :\n${instructionsInstall()}\n\n${suite}\n\nClub Réussir Ensemble`;
  window.open(`mailto:?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}`, '_blank');
};

let adEleveTokens = {}; // "classeId::eleveId" -> {token, eleveNom, createdAt}

async function chargerClassesAdmin(){
  const box = document.getElementById('ad-classes');
  box.innerHTML = '<div class="empty">Chargement…</div>';
  try{
    const [rosterSnap, codesSnap, elevesTokensSnap] = await Promise.all([
      window.fbGetDocs(window.fbCollection(window.fbDB,'edtxRoster')),
      window.fbGetDocs(window.fbCollection(window.fbDB,'edtxTableauCodes')),
      window.fbGetDocs(window.fbCollection(window.fbDB,'edtxTableauEleves'))
    ]);
    const codesMap = {};
    codesSnap.docs.forEach(d=>{ codesMap[d.id] = d.data(); });
    adEleveTokens = {};
    elevesTokensSnap.docs.forEach(d=>{
      const v = d.data();
      adEleveTokens[v.classeId+'::'+v.eleveId] = { token: d.id, ...v };
    });
    const classes = rosterSnap.docs.map(d=>({ id:d.id, name:d.data().name, eleves:d.data().eleves||[], code: codesMap[d.id] && codesMap[d.id].code }));
    if(!classes.length){
      box.innerHTML = `<div class="empty">🏫 Aucune classe synchronisée pour l'instant.<br>Utilisez le bouton « Synchroniser vers Espace Prof » dans Emploi du temps.</div>`;
      return;
    }
    box.innerHTML = classes.map(c=>`
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
          <div>
            <div style="font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--ink)">${esc(c.name)}</div>
            <div style="font-size:11.5px;color:var(--ink-soft)">${c.eleves.length} élève(s)</div>
          </div>
          ${c.code
            ? `<span class="who-badge" style="font-family:'DM Mono',monospace;font-size:15px">${esc(c.code)}</span>`
            : `<button class="btn btn-primary" onclick="genererCodeClasse('${c.id}','${esc(c.name).replace(/'/g,"\\'")}')">Générer un code classe</button>`}
        </div>
        ${c.code ? `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
          <button class="btn btn-green" onclick="partagerCodeWA('${c.id}','${esc(c.name).replace(/'/g,"\\'")}','${c.code}')">📱 WhatsApp (code classe)</button>
          <button class="btn btn-ghost" onclick="partagerCodeEmail('${esc(c.name).replace(/'/g,"\\'")}','${c.code}')">✉️ Email</button>
          <button class="btn btn-ghost" onclick="copierLienClasse('${c.id}')">🔗 Copier le lien</button>
          <button class="btn btn-danger" onclick="regenererCodeClasse('${c.id}','${esc(c.name).replace(/'/g,"\\'")}')">🔄 Régénérer</button>
        </div>` : ''}
        <details style="margin-top:12px">
          <summary style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--stylo)">🔗 Liens personnels par élève</summary>
          <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
            ${c.eleves.length ? c.eleves.map(e=>renderEleveTokenRow(c.id, c.name, e)).join('') : `<div style="font-size:12px;color:var(--ink-soft)">Aucun élève dans cette classe.</div>`}
          </div>
        </details>
      </div>
    `).join('');
  }catch(e){ box.innerHTML = `<div class="empty">Erreur de chargement : ${esc(e && e.message ? e.message : e)}</div>`; }
}

function renderEleveTokenRow(classeId, classeName, e){
  const fullName = (e.name + ' ' + (e.prenom||'')).trim();
  const key = classeId + '::' + e.id;
  const existing = adEleveTokens[key];
  const nameJs = esc(fullName).replace(/'/g,"\\'");
  const classeNameJs = esc(classeName).replace(/'/g,"\\'");
  if(!existing){
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #f1f5f9">
        <span style="font-size:12.5px;font-weight:600">👤 ${esc(fullName)}</span>
        <button class="btn-mini" onclick="genererLienEleve('${classeId}','${classeNameJs}','${e.id}','${nameJs}')">➕ Générer un lien</button>
      </div>`;
  }
  return `
    <div style="padding:6px 0;border-bottom:1px solid #f1f5f9">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
        <span style="font-size:12.5px;font-weight:600">👤 ${esc(fullName)}</span>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="btn-mini" style="color:#16a34a" onclick="partagerLienEleveWA('${existing.token}','${nameJs}','${classeNameJs}')">📱 WhatsApp</button>
        <button class="btn-mini" style="color:#2563eb" onclick="partagerLienEleveEmail('${existing.token}','${nameJs}','${classeNameJs}')">✉️ Email</button>
        <button class="btn-mini" onclick="copierLienEleve('${existing.token}')">🔗 Copier</button>
        <button class="btn-mini" style="color:#ef4444" onclick="regenererLienEleve('${classeId}','${classeNameJs}','${e.id}','${nameJs}','${existing.token}')">🔄 Régénérer</button>
      </div>
    </div>`;
}

function genererCode6(){ return String(Math.floor(100000 + Math.random()*900000)); }
function genererTokenEleve(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

window.genererCodeClasse = async function(classeId, classeName){
  try{
    await window.fbSetDoc(window.fbDoc(window.fbDB,'edtxTableauCodes',classeId), { code: genererCode6(), classeName, createdAt: Date.now() });
    chargerClassesAdmin();
  }catch(e){ alert('Erreur : ' + (e && e.message ? e.message : e)); }
};
window.regenererCodeClasse = async function(classeId, classeName){
  if(!confirm('Régénérer le code ? L\'ancien code ne fonctionnera plus.')) return;
  window.genererCodeClasse(classeId, classeName);
};

function buildClasseLink(classeId){
  return `${window.location.origin}${window.location.pathname}?classe=${classeId}`;
}
window.copierLienClasse = function(classeId){
  navigator.clipboard.writeText(buildClasseLink(classeId)).then(()=>alert('🔗 Lien copié !'));
};

window.partagerCodeEmail = function(classeName, code){

  const corps = encodeURIComponent(`Bonjour,\n\nCode d'accès au Tableau d'échange pour la classe ${classeName} : ${code}\n\nRendez-vous sur la page du Tableau d'échange et saisissez ce code pour poser vos questions aux professeurs.`);

// ── Liens personnels par élève ──
function buildEleveLink(token){
  return `${window.location.origin}${window.location.pathname}?eleve=${token}`;
}
window.genererLienEleve = async function(classeId, classeName, eleveId, eleveNom){
  try{
    const token = genererTokenEleve();
    await window.fbSetDoc(window.fbDoc(window.fbDB,'edtxTableauEleves', token), { classeId, classeName, eleveId: String(eleveId), eleveNom, createdAt: Date.now() });
    chargerClassesAdmin();
  }catch(e){ alert('Erreur : ' + (e && e.message ? e.message : e)); }
};
window.regenererLienEleve = async function(classeId, classeName, eleveId, eleveNom, oldToken){
  if(!confirm('Régénérer ce lien personnel ? L\'ancien lien ne fonctionnera plus.')) return;
  try{
    if(oldToken){ await window.fbDeleteDoc(window.fbDoc(window.fbDB,'edtxTableauEleves', oldToken)); }
  }catch(e){}
  window.genererLienEleve(classeId, classeName, eleveId, eleveNom);
};
window.copierLienEleve = function(token){
  navigator.clipboard.writeText(buildEleveLink(token)).then(()=>alert('🔗 Lien personnel copié !'));
};
window.partagerLienEleveWA = function(token, eleveNom, classeName){

};
window.partagerLienEleveEmail = function(token, eleveNom, classeName){
  const sujet = encodeURIComponent(`Ton accès au Tableau d'échange — ${classeName}`);
  const corps = encodeURIComponent(`Bonjour ${eleveNom},\n\nVoici ton lien personnel pour accéder au Tableau d'échange de la classe ${classeName} et poser tes questions aux professeurs :\n\n${buildEleveLink(token)}`);
  window.open(`mailto:?subject=${sujet}&body=${corps}`, '_blank');
};

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
