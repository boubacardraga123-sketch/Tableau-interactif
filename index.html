<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tableau d'échange">
<meta name="description" content="Tableau d'échange questions/réponses entre professeurs et élèves — Club Réussir Ensemble">
<title>Tableau d'échange — Prof & Élèves</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   SYSTÈME DE DESIGN — « Ardoise & Cahier »
   Un tableau de classe (en-tête ardoise, craie) qui ouvre sur des
   pages de cahier d'écolier (papier crème, lignes réglées, marge
   rouge). Accent « stylo bleu » (bleu Bic) hérité de l'écosystème
   Club Réussir Ensemble pour les actions ; le vert sert aux
   corrections du professeur, comme un stylo de correction.
   ══════════════════════════════════════════════════════════════ */
:root{
  --board:#1e3d31; --board-dark:#142e24; --board-edge:#6b4a30;
  --chalk:#f6f2e6; --chalk-dim:#bcccc0;
  --paper:#faf5e9; --paper-card:#fffcf4; --rule:#e8dcc0;
  --marge:#b5433f; --marge-soft:#e7c9c3;
  --ink:#25303a; --ink-soft:#63707a;
  --stylo:#6366f1; --stylo-dark:#4f52e0; --stylo-tint:#eef1ff;
  --correction:#2f7d55; --correction-tint:#eaf6ee; --correction-dark:#215e3f;
  --cover-eleve:#c1602f; --cover-prof:#2f6b4f; --cover-admin:#233a5c;
  --danger:#ef4444; --danger-tint:#fdeceb;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
.offline-banner{position:sticky;top:0;z-index:50;background:#f0c14b;color:#3a2c05;font-family:'DM Sans',sans-serif;font-weight:700;font-size:12.5px;text-align:center;padding:8px 12px;border-bottom:1.5px solid #d9a82e}
.media-offline-badge{display:inline-flex;align-items:center;gap:3px;font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:700;color:#2f7d55;background:#eaf6ee;border:1px solid #cfe9d8;border-radius:6px;padding:2px 6px;margin-top:5px}
body{
  background:var(--paper);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding-bottom:24px}

/* ── En-tête « ardoise » ── */
.board-header{
  background:
    radial-gradient(ellipse at 18% 22%, rgba(255,255,255,.05), transparent 42%),
    radial-gradient(ellipse at 82% 70%, rgba(255,255,255,.04), transparent 38%),
    linear-gradient(180deg, var(--board) 0%, var(--board-dark) 100%);
  border-bottom:5px solid var(--board-edge);
  padding:22px 18px 18px;
  margin-bottom:18px;
  position:relative;
  overflow:hidden;
}
.board-header::after{
  content:'';
  position:absolute; inset:0;
  background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 7px);
  pointer-events:none;
}
.board-inner{max-width:684px;margin:0 auto;position:relative;z-index:1}
h1{
  font-family:'Caveat',cursive;
  font-weight:700;
  font-size:34px;
  line-height:1;
  color:var(--chalk);
  text-shadow:0 1px 0 rgba(0,0,0,.15);
  letter-spacing:.3px;
}
.subtitle{font-size:12px;color:var(--chalk-dim);margin-top:4px;font-weight:500;letter-spacing:.2px}
.craies{display:flex;gap:7px;margin-top:12px}
.craie{width:15px;height:8px;border-radius:3px;box-shadow:inset 0 -2px 2px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.2)}

/* ── Cartes génériques (page de cahier) ── */
.card{
  background:var(--paper-card);
  background-image:repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px);
  border-radius:var(--radius);
  padding:16px 16px 16px 30px;
  margin:0 0 14px;
  box-shadow:0 1px 3px rgba(30,20,10,.08);
  position:relative;
  border:1px solid #f0e8d4;
}
.card::before{
  content:'';
  position:absolute; top:10px; bottom:10px; left:16px;
  width:1.5px; background:var(--marge-soft);
}
.btn{padding:10px 16px;border-radius:9px;border:none;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,background .15s}
.btn-primary{background:var(--stylo);color:#fff}
.btn-primary:hover{background:var(--stylo-dark)}
.btn-green{background:var(--correction);color:#fff}
.btn-green:hover{background:var(--correction-dark)}
.btn-ghost{background:var(--stylo-tint);color:var(--stylo-dark)}
.btn-ghost:hover{background:#dfe3ff}
.btn-danger{background:var(--danger-tint);color:var(--danger)}
.btn-block{width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab-chip:focus-visible,.role-card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--stylo);outline-offset:2px}

input[type=text],input[type=password],select,textarea{padding:10px 12px;border:1.5px solid var(--rule);border-radius:9px;font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--stylo)}
textarea{resize:vertical;min-height:70px}
label.f-label{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:12px}

/* ── Écran de rôle : couvertures de cahier ── */
.role-grid{display:grid;grid-template-columns:1fr;gap:12px}
.role-card{
  border-radius:14px;padding:20px 18px 20px 26px;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  border:none; position:relative; overflow:hidden;
  box-shadow:0 2px 6px rgba(20,15,5,.16);
  transition:transform .15s, box-shadow .15s;
  color:#fff;
}
.role-card:hover{transform:translateY(-2px) rotate(-.15deg);box-shadow:0 6px 14px rgba(20,15,5,.22)}
.role-card::before{ /* reliure spirale */
  content:'';
  position:absolute; top:8px; bottom:8px; left:8px; width:2px;
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,.55) 0 3px, transparent 3px 9px);
}
.role-card::after{ /* coin corné */
  content:'';
  position:absolute; top:0; right:0; width:0; height:0;
  border-style:solid; border-width:0 22px 22px 0;
  border-color:transparent rgba(0,0,0,.16) transparent transparent;
}
.role-card:nth-child(1){background:linear-gradient(155deg,var(--cover-eleve),#a1501f)}
.role-card:nth-child(2){background:linear-gradient(155deg,var(--cover-prof),#1f5138)}
.role-card:nth-child(3){background:linear-gradient(155deg,var(--cover-admin),#152743)}
.role-emoji{font-size:26px;width:48px;height:48px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;backdrop-filter:blur(2px)}
.role-title{font-family:'Fraunces',serif;font-size:16.5px;font-weight:700;color:#fff}
.role-desc{font-size:12px;color:rgba(255,255,255,.82);margin-top:2px}

.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;gap:10px;flex-wrap:wrap}
.who-badge{font-size:11px;background:var(--stylo-tint);color:var(--stylo-dark);border-radius:20px;padding:5px 12px;font-weight:700}
.link-btn{background:none;border:none;color:var(--stylo);font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:underline}

/* ── Onglets classes : onglets de classeur ── */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0}
.tab-chip{
  flex-shrink:0;padding:9px 16px 8px;border:none;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:12.5px;
  background:#efe6cd;color:var(--ink-soft);white-space:nowrap;
  clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);
  margin-right:-4px;
}
.tab-chip.active{background:var(--paper-card);color:var(--stylo-dark);position:relative;z-index:1;box-shadow:0 -2px 4px rgba(20,15,5,.06)}

/* ── Fil de questions (entrées de cahier) ── */
.q-item{background:var(--paper-card)}
.q-item.locked{opacity:.65}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.q-mat{font-size:10px;font-weight:700;background:var(--stylo-tint);color:var(--stylo-dark);border-radius:5px;padding:3px 8px;text-transform:uppercase;letter-spacing:.3px}
.q-time{font-size:10.5px;color:#a8998a;font-family:'DM Mono',monospace}
.q-stamp{
  font-family:'Fraunces',serif;font-weight:700;font-size:10.5px;color:var(--correction);
  border:1.5px solid var(--correction);border-radius:5px;padding:1px 7px;
  transform:rotate(-4deg);letter-spacing:.4px;text-transform:uppercase;
}
.q-eleve{font-family:'Fraunces',serif;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px}
.q-text{font-size:13.5px;color:#3a4552;line-height:1.5;white-space:pre-wrap}
.q-lock-note{font-size:11px;color:#a8998a;margin-top:8px;font-style:italic}
.q-del-btn{background:none;border:none;color:var(--marge);font-size:14px;cursor:pointer;padding:3px 6px;border-radius:6px;line-height:1;flex-shrink:0}
.q-del-btn:hover{background:var(--danger-tint)}

.r-box{margin-top:10px;background:var(--correction-tint);border-radius:9px;padding:10px 12px;border-left:3px solid var(--correction)}
.r-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.r-prof{font-size:11.5px;font-weight:700;color:var(--correction-dark)}
.r-time{font-size:10px;color:#6b9080;font-family:'DM Mono',monospace}
.r-text{font-size:13px;color:#215e3f;line-height:1.45;white-space:pre-wrap}

.ans-form{margin-top:10px}
.ans-form textarea{min-height:44px;font-size:13px}
.ans-form .composer-send{margin-top:8px}

/* ── Composeur Clavier / Dessin ── */
.composer-tabs{display:flex;gap:6px;margin-bottom:8px}
.composer-tab{padding:6px 12px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;color:var(--ink-soft);font-weight:700;font-size:11.5px;cursor:pointer;font-family:'DM Sans',sans-serif}
.composer-tab.active{background:var(--stylo);color:#fff;border-color:var(--stylo)}
.draw-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.color-swatches{display:flex;gap:5px}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--rule);cursor:pointer;padding:0}
.tool-btns{display:flex;gap:4px}
.size-btns{display:flex;gap:4px}
.size-btns button,.btn-mini,.tool-btns button{padding:5px 9px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;color:var(--ink-soft);font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.size-btns button:hover,.btn-mini:hover,.tool-btns button:hover{background:#f5efdd}
.tool-btns button.active,.btn-mini.active{background:var(--stylo);color:#fff;border-color:var(--stylo)}
.draw-board-frame{position:relative;border-radius:14px;padding:9px;background:linear-gradient(180deg, var(--board) 0%, var(--board-dark) 100%);border:1px solid var(--board-edge);box-shadow:0 3px 10px rgba(20,15,5,.2), inset 0 0 0 1px rgba(255,255,255,.03)}
.draw-board-frame::after{content:'';position:absolute;inset:9px;border-radius:8px;background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0 2px, transparent 2px 7px);pointer-events:none}
.draw-canvas{width:100%;height:380px;border-radius:8px;touch-action:none;background:#15181b;display:block;cursor:crosshair;position:relative;z-index:1;transition:height .2s}
.draw-canvas.expanded{height:600px}
.q-dessin-img,.r-dessin-img{max-width:100%;border-radius:9px;margin-top:8px;border:1px solid var(--rule);display:block}

/* ── Outils mathématiques : indice & puissance ── */
.math-tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.math-tools .btn-mini.active{background:var(--stylo);color:#fff;border-color:var(--stylo)}
.math-palette{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;padding:8px;background:#f5efdd;border-radius:9px;border:1.5px solid var(--rule)}
.math-key{width:32px;height:32px;border-radius:7px;border:1.5px solid var(--rule);background:#fff;font-family:'DM Mono',monospace;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.math-key:hover{background:var(--stylo-tint);border-color:var(--stylo)}
.math-key-close{color:var(--danger);font-weight:700;border-color:var(--danger-tint)}

/* ── Enregistrement audio ── */
.audio-rec{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1.5px solid var(--rule);border-radius:10px}
.audio-rec-btn{width:46px;height:46px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s}
.audio-rec-btn:active{transform:scale(.94)}
.audio-rec-btn.recording{animation:pulseRec 1.2s infinite}
@keyframes pulseRec{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 11px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.audio-rec-status{font-size:12px;color:var(--ink-soft);flex:1;line-height:1.4}
.audio-preview{margin-top:10px;display:none;align-items:center;gap:8px}
.audio-preview audio{flex:1;height:36px}
.q-audio,.r-audio{width:100%;height:36px;margin-top:8px;display:block}

/* ── Pièce jointe (photo / PDF d'un sujet) ── */
.file-drop{display:flex;align-items:center;gap:10px;padding:14px;background:#fff;border:1.5px dashed var(--rule);border-radius:10px;cursor:pointer;text-align:center;justify-content:center}
.file-drop:hover{border-color:var(--stylo);background:var(--stylo-tint)}
.file-drop span{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.file-preview{margin-top:10px;display:none;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:8px 10px}
.file-hint{font-size:10.5px;color:#a8998a;margin-top:5px}
.q-fichier-link,.r-fichier-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--stylo-dark);text-decoration:none;background:var(--stylo-tint);padding:8px 12px;border-radius:9px}
.q-fichier-link:hover,.r-fichier-link:hover{background:#dfe3ff}
.upload-progress{margin-top:8px}
.upload-bar-track{background:#e8dcc0;border-radius:6px;overflow:hidden;height:8px}
.upload-bar-fill{background:var(--stylo);height:100%;width:0%;transition:width .15s}

/* ── Sous-onglets vidéo (fichier / lien YouTube) ── */
.video-subtabs{display:flex;gap:6px;margin-bottom:8px}
.video-subtab{padding:6px 12px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;color:var(--ink-soft);font-weight:700;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif}
.video-subtab.active{background:#c1272d;color:#fff;border-color:#c1272d}
.youtube-input{width:100%;padding:11px 12px;border:1.5px solid var(--rule);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;background:#fff;margin-bottom:8px}
.youtube-input:focus{outline:none;border-color:var(--stylo)}
.yt-embed-wrap{position:relative;width:100%;padding-top:56.25%;border-radius:9px;margin-top:8px;overflow:hidden;background:#000}
.yt-embed-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ── Annales (bibliothèque d'anciens sujets) ── */
.annale-tags{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.annale-tag{font-size:10px;font-weight:700;border-radius:5px;padding:3px 8px;text-transform:uppercase;letter-spacing:.3px}
.annale-tag-matiere{background:var(--stylo-tint);color:var(--stylo-dark)}
.annale-tag-niveau{background:var(--correction-tint);color:var(--correction-dark)}
.annale-tag-annee{background:var(--marge-soft);color:var(--marge)}
.annale-titre{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--ink);margin-bottom:2px}
.annale-desc{font-size:13px;color:#3a4552;line-height:1.5;margin:4px 0 8px;white-space:pre-wrap}
.annale-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.annale-filters>*{flex:1;min-width:110px}
.annale-file-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--stylo-dark);text-decoration:none;background:var(--stylo-tint);padding:8px 12px;border-radius:9px}
.annale-file-link:hover{background:#dfe3ff}
.annale-img-prev{max-width:100%;border-radius:9px;border:1px solid var(--rule);display:block;margin-top:6px}
.annale-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
.upload-status{font-size:11px;color:var(--ink-soft);margin-top:4px}
.q-video,.r-video,.cours-video{width:100%;border-radius:9px;margin-top:8px;display:block;background:#000}
.cours-card{background:var(--paper-card)}
.cours-titre{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--ink);margin-bottom:2px}
.cours-desc{font-size:13px;color:#3a4552;line-height:1.5;margin:6px 0;white-space:pre-wrap}
.cours-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sub-tabs{display:flex;gap:6px;margin:0 0 14px}
.sub-tab{padding:8px 16px;border-radius:20px;border:1.5px solid var(--rule);background:#fff;color:var(--ink-soft);font-weight:700;font-size:12.5px;cursor:pointer;font-family:'DM Sans',sans-serif}
.sub-tab.active{background:var(--stylo);color:#fff;border-color:var(--stylo)}

.empty{text-align:center;padding:30px 14px;color:#a8998a;font-size:13px}

.fab-new{position:sticky;bottom:14px;display:flex;justify-content:center;margin-top:8px}

/* ── Auth screens ── */
.auth-box{max-width:420px;margin:24px auto 0}
.center{text-align:center;margin-top:10px}
.roster-hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px}

#screen{padding:0 18px}
@media(min-width:640px){.role-grid{grid-template-columns:1fr 1fr 1fr}}
@media(prefers-reduced-motion:reduce){.role-card,.btn{transition:none}}
</style>
</head>

</div>

function insertAtCursor(fieldId, text){
  const el = document.getElementById(fieldId);
  if(!el) return;
  const start = el.selectionStart!=null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd!=null ? el.selectionEnd : el.value.length;
  const val = el.value;
  el.value = val.slice(0,start) + text + val.slice(end);
  const pos = start + text.length;
  el.focus();
  el.setSelectionRange(pos,pos);
}
window.insertMathChar = function(fieldId, btn){
  insertAtCursor(fieldId, btn.getAttribute('data-char'));
};

// ── Enregistrement audio (message vocal) ──
const audioStates = {};

window.toggleAudioRecording = async function(prefix){
  const st = audioStates[prefix] || (audioStates[prefix] = {});
  if(st.recording){
    try{ st.recorder.stop(); }catch(e){}
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert("L'enregistrement audio n'est pas pris en charge par ce navigateur.");
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    st.stream = stream;
    st.chunks = [];
    const mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm')) ? 'audio/webm' : '';
    st.recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    st.recorder.ondataavailable = e => { if(e.data && e.data.size>0) st.chunks.push(e.data); };
    st.recorder.onstop = () => {
      st.recording = false;
      stream.getTracks().forEach(t=>t.stop());
      if(st.timerInt){ clearInterval(st.timerInt); st.timerInt = null; }
      const blob = new Blob(st.chunks, { type: (st.recorder && st.recorder.mimeType) || 'audio/webm' });
      const reader = new FileReader();
      reader.onloadend = () => {
        st.dataUrl = reader.result;
        renderAudioPreview(prefix);
        updateAudioBtn(prefix);
      };
      reader.readAsDataURL(blob);
    };
    st.recorder.start();
    st.recording = true;
    st.startedAt = Date.now();
    updateAudioBtn(prefix);
    st.timerInt = setInterval(()=>updateAudioTimer(prefix), 500);
  }catch(e){
    alert("Impossible d'accéder au microphone : " + (e && e.message ? e.message : e));
  }
};

function updateAudioBtn(prefix){
  const st = audioStates[prefix] || {};
  const btn = document.getElementById(prefix+'-audio-btn');
  const status = document.getElementById(prefix+'-audio-status');
  if(!btn) return;
  if(st.recording){
    btn.classList.add('recording'); btn.textContent = '⏹️';
    if(status) status.textContent = 'Enregistrement… (0 s) — touchez pour arrêter';
  }else{
    btn.classList.remove('recording'); btn.textContent = '🎤';
    if(status) status.textContent = st.dataUrl ? '✅ Message vocal prêt (réécoutez ci-dessous)' : 'Appuyez pour enregistrer un message vocal (60 s max)';
  }
}

function updateAudioTimer(prefix){
  const st = audioStates[prefix];
  if(!st || !st.recording) return;
  const status = document.getElementById(prefix+'-audio-status');
  const secs = Math.floor((Date.now()-st.startedAt)/1000);
  if(status) status.textContent = `Enregistrement… (${secs} s) — touchez pour arrêter`;
  if(secs >= 60){ try{ st.recorder.stop(); }catch(e){} }
}

function renderAudioPreview(prefix){
  const box = document.getElementById(prefix+'-audio-preview');
  if(!box) return;
  const st = audioStates[prefix];
  if(!st || !st.dataUrl){ box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'flex';
  box.innerHTML = `<audio controls src="${st.dataUrl}"></audio><button type="button" class="btn-mini" onclick="deleteAudioRecording('${prefix}')">🗑️ Supprimer</button>`;
}

window.deleteAudioRecording = function(prefix){
  const st = audioStates[prefix];
  if(st) st.dataUrl = null;
  renderAudioPreview(prefix);
  updateAudioBtn(prefix);
};

function audioHasContent(prefix){ const st = audioStates[prefix]; return !!(st && st.dataUrl); }
function audioToDataURL(prefix){ const st = audioStates[prefix]; return st ? st.dataUrl : null; }
function resetAudioState(prefix){
  const st = audioStates[prefix];
  if(st){ st.dataUrl = null; st.chunks = []; }
  renderAudioPreview(prefix);
  updateAudioBtn(prefix);
}

// ── Pièce jointe : photo ou PDF d'un sujet ──
const fileStates = {};
const FILE_MAX_BYTES = 5 * 1024 * 1024; // 5 Mo à la sélection (avant compression image)
const PDF_MAX_BYTES = 650 * 1024; // le base64 ajoute ~37% : reste sous la limite Firestore de 1 Mo/document

function readFileAsDataUrl(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('Lecture du fichier impossible.'));
    r.readAsDataURL(file);
  });
}

function compressImageFile(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const maxDim = 1280;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      res(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image invalide.')); };
    img.src = url;
  });
}

window.handleFileSelect = async function(prefix, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  if(!isImage && !isPdf){ alert('Seuls les fichiers image ou PDF sont acceptés.'); inputEl.value=''; return; }
  if(file.size > FILE_MAX_BYTES){ alert('Ce fichier est trop volumineux (5 Mo max).'); inputEl.value=''; return; }
  try{
    if(isImage){
      const dataUrl = await compressImageFile(file);
      fileStates[prefix] = { dataUrl, type:'image', nom:file.name };
    } else {
      if(file.size > PDF_MAX_BYTES){ alert('Ce PDF est trop volumineux. Merci de joindre un fichier de moins de 650 Ko (ou une photo des pages).'); inputEl.value=''; return; }
      const dataUrl = await readFileAsDataUrl(file);
      fileStates[prefix] = { dataUrl, type:'pdf', nom:file.name };
    }
    renderFilePreview(prefix);
  }catch(e){ alert('Erreur : ' + (e && e.message ? e.message : e)); }
  inputEl.value = '';
};

function renderFilePreview(prefix){
  const box = document.getElementById(prefix+'-file-preview');
  if(!box) return;
  const st = fileStates[prefix];
  if(!st){ box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'flex';
  if(st.type==='image'){
    box.innerHTML = `<img src="${st.dataUrl}" style="max-width:96px;max-height:96px;border-radius:8px;border:1px solid var(--rule);display:block"><button type="button" class="btn-mini" onclick="deleteFileAttachment('${prefix}')">🗑️ Supprimer</button>`;
  } else {
    box.innerHTML = `<span style="font-size:12.5px;font-weight:700;color:var(--ink)">📄 ${esc(st.nom)}</span><button type="button" class="btn-mini" onclick="deleteFileAttachment('${prefix}')">🗑️ Supprimer</button>`;
  }
}

window.deleteFileAttachment = function(prefix){
  delete fileStates[prefix];
  renderFilePreview(prefix);
};

function fileHasContent(prefix){ return !!fileStates[prefix]; }
function fileGetData(prefix){ return fileStates[prefix] || null; }
function resetFileState(prefix){ delete fileStates[prefix]; renderFilePreview(prefix); }

// ── Vidéo de cours (upload vers Firebase Storage) ──
const videoStates = {};
const VIDEO_MAX_BYTES = 200 * 1024 * 1024; // 200 Mo

function slugifyFileName(name){
  return String(name||'video').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-80);
}

window.handleVideoSelect = function(prefix, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith('video/')){ alert('Veuillez choisir un fichier vidéo (MP4, MOV...).'); inputEl.value=''; return; }
  if(file.size > VIDEO_MAX_BYTES){ alert('Cette vidéo est trop volumineuse (200 Mo max).'); inputEl.value=''; return; }
  if(!fbReady){ alert('Connexion en cours, réessayez dans un instant.'); inputEl.value=''; return; }
  uploadVideoFile(prefix, file);
  inputEl.value = '';
};

function uploadVideoFile(prefix, file){
  const progWrap = document.getElementById(prefix+'-video-progress');
  const bar = document.getElementById(prefix+'-video-bar');
  const status = document.getElementById(prefix+'-video-status');
  const preview = document.getElementById(prefix+'-video-preview');
  if(preview){ preview.style.display='none'; preview.innerHTML=''; }
  if(progWrap) progWrap.style.display='block';
  if(bar) bar.style.width='0%';
  if(status) status.textContent = 'Envoi en cours… 0 %';
  const path = 'edtxVideos/' + Date.now() + '_' + slugifyFileName(file.name);
  const sref = window.fbStorageRef(window.fbStorage, path);
  const task = window.fbUploadBytesResumable(sref, file, { contentType: file.type });
  videoStates[prefix] = { uploading:true, task, path };
  task.on('state_changed',
    snap=>{
      const pct = snap.totalBytes ? Math.round((snap.bytesTransferred/snap.totalBytes)*100) : 0;
      if(bar) bar.style.width = pct+'%';
      if(status) status.textContent = `Envoi en cours… ${pct} %`;
    },
    err=>{
      videoStates[prefix] = null;
      if(progWrap) progWrap.style.display='none';
      alert("Erreur d'envoi de la vidéo : " + (err && err.message ? err.message : err));
    },
    async ()=>{
      try{
        const url = await window.fbGetDownloadURL(task.snapshot.ref);
        videoStates[prefix] = { uploading:false, url, nom:file.name, path };
        if(status) status.textContent = '✅ Vidéo envoyée';
        renderVideoPreview(prefix);
      }catch(err){
        videoStates[prefix] = null;
        if(progWrap) progWrap.style.display='none';
        alert("Erreur d'envoi de la vidéo : " + (err && err.message ? err.message : err));
      }
    }
  );
}

function renderVideoPreview(prefix){
  const box = document.getElementById(prefix+'-video-preview');
  if(!box) return;
  const st = videoStates[prefix];
  if(!st || !st.url){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='flex';
  if(st.youtube){
    box.innerHTML = `<span style="font-size:12.5px;font-weight:700;color:var(--ink)">📺 Lien YouTube ajouté</span><button type="button" class="btn-mini" onclick="deleteVideoAttachment('${prefix}')">🗑️ Supprimer</button>`;
  } else {
    box.innerHTML = `<span style="font-size:12.5px;font-weight:700;color:var(--ink)">🎥 ${esc(st.nom)}</span><button type="button" class="btn-mini" onclick="deleteVideoAttachment('${prefix}')">🗑️ Supprimer</button>`;
  }

// ── Vidéo de cours (lien YouTube) ──
function extractYouTubeId(url){
  if(!url) return null;
  const m = String(url).trim().match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/)|youtube\.com\/watch\?[^#]*[?&]v=)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

window.handleYoutubeLink = function(prefix){
  const input = document.getElementById(prefix+'-youtube-input');
  const raw = input ? input.value.trim() : '';
  if(!raw){ alert('Collez un lien YouTube avant de valider.'); return; }
  const yid = extractYouTubeId(raw);
  if(!yid){ alert("Lien YouTube non reconnu. Exemple valide : https://www.youtube.com/watch?v=XXXXXXXXXXX"); return; }
  videoStates[prefix] = { uploading:false, url:`https://www.youtube.com/watch?v=${yid}`, nom:'Vidéo YouTube', youtube:true };
  const progWrap = document.getElementById(prefix+'-video-progress');
  if(progWrap) progWrap.style.display='none';
  renderVideoPreview(prefix);
  if(input) input.value = '';
};

// ── Affichage d'une vidéo : lecteur natif (fichier uploadé) ou lecteur YouTube intégré ──
function videoEmbedHtml(url, cssClass){
  const yid = extractYouTubeId(url);
  if(yid){
    return `<div class="yt-embed-wrap"><iframe src="https://www.youtube.com/embed/${yid}" title="Vidéo YouTube" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  }
  return `<video class="${cssClass}" controls preload="metadata" src="${esc(url)}" data-media-url="${esc(url)}" data-media-kind="video"></video>`;
}

function videoHasContent(prefix){ const st = videoStates[prefix]; return !!(st && st.url); }
function videoGetData(prefix){ const st = videoStates[prefix]; return st && st.url ? { url:st.url, nom:st.nom } : null; }

// ── Moteur de dessin à main libre (vectoriel, avec outils, formes, annuler/rétablir) ──
const canvasStates = {};
const BOARD_BG = '#15181b';

function ptFromEvent(canvas, e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}

function drawGridOnCanvas(ctx, canvas){
  const step = 32;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.07)';
  ctx.lineWidth = 1;
  for(let x=0; x<=canvas.width; x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for(let y=0; y<=canvas.height; y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
  ctx.restore();
}

function drawStroke(ctx, s){
  const tool = s.tool || 'pen';
  ctx.strokeStyle = s.color;
  ctx.fillStyle = s.color;
  ctx.lineWidth = s.size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if(tool==='pen' || tool==='eraser'){
    if(s.points.length < 2){
      ctx.beginPath();
      ctx.arc(s.points[0].x, s.points[0].y, s.size/2, 0, Math.PI*2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(s.points[0].x, s.points[0].y);
    for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.stroke();
  } else if(tool==='line'){
    if(s.points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(s.points[0].x, s.points[0].y);
    ctx.lineTo(s.points[1].x, s.points[1].y);
    ctx.stroke();
  } else if(tool==='rect'){
    if(s.points.length < 2) return;
    const [p0,p1] = s.points;
    ctx.strokeRect(Math.min(p0.x,p1.x), Math.min(p0.y,p1.y), Math.abs(p1.x-p0.x), Math.abs(p1.y-p0.y));
  } else if(tool==='circle'){
    if(s.points.length < 2) return;
    const [p0,p1] = s.points;
    const cx=(p0.x+p1.x)/2, cy=(p0.y+p1.y)/2, rx=Math.abs(p1.x-p0.x)/2, ry=Math.abs(p1.y-p0.y)/2;
    ctx.beginPath();
    ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    ctx.stroke();
  }
}

function redrawCanvas(canvasId){
  const st = canvasStates[canvasId];
  if(!st) return;
  const ctx = st.ctx, canvas = st.canvas;
  ctx.fillStyle = BOARD_BG;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  if(st.showGrid) drawGridOnCanvas(ctx, canvas);
  st.strokes.forEach(s=>drawStroke(ctx, s));
}

function initCanvas(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas || canvas.__inited) return;
  canvas.__inited = true;
  const ctx = canvas.getContext('2d');
  const st = { canvas, ctx, strokes: [], redoStack: [], current: null, color: '#f6f2e6', size: 4, tool: 'pen', showGrid: false };
  canvasStates[canvasId] = st;
  redrawCanvas(canvasId);

  function down(e){
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    const p = ptFromEvent(canvas, e);
    const tool = st.tool || 'pen';
    const color = tool==='eraser' ? BOARD_BG : st.color;
    const size = tool==='eraser' ? Math.max(st.size, 16) : st.size;
    st.current = { tool, color, size, points: [p] };
    st.strokes.push(st.current);
    st.redoStack = [];
    redrawCanvas(canvasId);
  }
  function move(e){
    if(!st.current) return;
    e.preventDefault();
    const p = ptFromEvent(canvas, e);
    if(st.current.tool==='line' || st.current.tool==='rect' || st.current.tool==='circle'){
      st.current.points = [st.current.points[0], p];
    } else {
      st.current.points.push(p);
    }
    redrawCanvas(canvasId);
  }
  function up(){ st.current = null; }
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointerleave', up);
  canvas.addEventListener('pointercancel', up);
}

window.setCanvasColor = function(canvasId, color){ const st = canvasStates[canvasId]; if(st) st.color = color; };
window.setCanvasSize  = function(canvasId, size){ const st = canvasStates[canvasId]; if(st) st.size = size; };
window.setCanvasTool = function(canvasId, tool){
  const st = canvasStates[canvasId]; if(!st) return;
  st.tool = tool;
  const prefix = canvasId.replace(/-canvas$/,'');
  ['pen','eraser','line','rect','circle'].forEach(t=>{
    const b = document.getElementById(prefix+'-tool-'+t);
    if(b) b.classList.toggle('active', t===tool);
  });
};
window.toggleCanvasGrid = function(canvasId){
  const st = canvasStates[canvasId]; if(!st) return;
  st.showGrid = !st.showGrid;
  const prefix = canvasId.replace(/-canvas$/,'');
  const btn = document.getElementById(prefix+'-grid-btn');
  if(btn) btn.classList.toggle('active', st.showGrid);
  redrawCanvas(canvasId);
};
window.toggleCanvasExpand = function(canvasId){
  const canvasEl = document.getElementById(canvasId);
  if(canvasEl) canvasEl.classList.toggle('expanded');
};
window.undoCanvas = function(canvasId){
  const st = canvasStates[canvasId];
  if(st && st.strokes.length){ st.redoStack.push(st.strokes.pop()); redrawCanvas(canvasId); }
};
window.redoCanvas = function(canvasId){
  const st = canvasStates[canvasId];
  if(st && st.redoStack && st.redoStack.length){ st.strokes.push(st.redoStack.pop()); redrawCanvas(canvasId); }
};
window.clearCanvas = function(canvasId){
  const st = canvasStates[canvasId];
  if(st){ st.strokes = []; st.redoStack = []; redrawCanvas(canvasId); }
};
function canvasHasContent(canvasId){ const st = canvasStates[canvasId]; return !!(st && st.strokes.length); }
function canvasToDataURL(canvasId){ const st = canvasStates[canvasId]; return st ? st.canvas.toDataURL('image/jpeg', 0.75) : null; }

};

let profClasses = [];
let profActiveClasse = null;
let profActiveTab = 'questions'; // 'questions' | 'cours' | 'annales'

function renderProfBoard(s){
  screen(`

async function chargerClassesPourProf(s){
  try{
    const snap = await window.fbGetDocs(window.fbCollection(window.fbDB,'edtxTableauCodes'));
    profClasses = snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(a.classeName||'').localeCompare(b.classeName||''));

function renderProfTabs(){
  const box = document.getElementById('pr-tabs');

function renderProfSubTabs(){

window.profChangerSousOnglet = function(tab){

};

window.profChangerClasse = function(classeId){
  profActiveClasse = classeId;
  renderProfTabs();
  ouvrirClasseProf(classeId, getSession());
};

function ouvrirClasseProf(classeId, s){
  document.getElementById('pr-board').innerHTML = '<div class="empty">Chargement…</div>';
  if(profActiveTab==='annales'){
    if(unsubBoard){ unsubBoard(); unsubBoard=null; }
    if(unsubCours){ unsubCours(); unsubCours=null; }
    ouvrirAnnalesProf(s);

    if(unsubBoard){ unsubBoard(); unsubBoard=null; }

    if(unsubAnnales){ unsubAnnales(); unsubAnnales=null; }
    ecouterTableauClasse(classeId, list => renderBoardProf(list, s));

// ═══════════════ Annales (bibliothèque d'anciens sujets, par matière/niveau/année) ═══════════════
const NIVEAUX_SUGGESTIONS = ['7e année','8e année','9e année','10e année','11e année','12e année','Terminale SM','Terminale SE','Terminale SS','BT1','BT2','BTS1','BTS2'];
const ANNALE_MAX_BYTES = 20 * 1024 * 1024; // 20 Mo (stocké sur Firebase Storage)
const annaleFileStates = {};
let annalesCache = [];
let unsubAnnales = null;

function ecouterAnnales(cb){
  if(unsubAnnales) unsubAnnales();
  unsubAnnales = window.fbOnSnapshot(window.fbCollection(window.fbDB,'edtxAnnales'), snap=>{
    annalesCache = snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    cb(annalesCache);
  }, err=>console.warn('annales listener error', err));
}

function slugifyAnnaleFileName(name){ return slugifyFileName(name); }

window.handleAnnaleFileSelect = function(prefix, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  if(!isImage && !isPdf){ alert('Seuls les fichiers image ou PDF sont acceptés.'); inputEl.value=''; return; }
  if(file.size > ANNALE_MAX_BYTES){ alert('Ce fichier est trop volumineux (20 Mo max).'); inputEl.value=''; return; }
  if(!fbReady){ alert('Connexion en cours, réessayez dans un instant.'); inputEl.value=''; return; }
  uploadAnnaleFile(prefix, file, isImage ? 'image' : 'pdf');
  inputEl.value = '';
};

function uploadAnnaleFile(prefix, file, type){
  const progWrap = document.getElementById(prefix+'-an-progress');
  const bar = document.getElementById(prefix+'-an-bar');
  const status = document.getElementById(prefix+'-an-status');
  const preview = document.getElementById(prefix+'-an-file-preview');
  if(preview){ preview.style.display='none'; preview.innerHTML=''; }
  if(progWrap) progWrap.style.display='block';
  if(bar) bar.style.width='0%';
  if(status) status.textContent = 'Envoi en cours… 0 %';
  const path = 'edtxAnnales/' + Date.now() + '_' + slugifyAnnaleFileName(file.name);
  const sref = window.fbStorageRef(window.fbStorage, path);
  const task = window.fbUploadBytesResumable(sref, file, { contentType: file.type });
  annaleFileStates[prefix] = { uploading:true, task, path };
  task.on('state_changed',
    snap=>{
      const pct = snap.totalBytes ? Math.round((snap.bytesTransferred/snap.totalBytes)*100) : 0;
      if(bar) bar.style.width = pct+'%';
      if(status) status.textContent = `Envoi en cours… ${pct} %`;
    },
    err=>{
      annaleFileStates[prefix] = null;
      if(progWrap) progWrap.style.display='none';
      alert("Erreur d'envoi du fichier : " + (err && err.message ? err.message : err));
    },
    async ()=>{
      try{
        const url = await window.fbGetDownloadURL(task.snapshot.ref);
        annaleFileStates[prefix] = { uploading:false, url, nom:file.name, type, path };
        if(status) status.textContent = '✅ Fichier envoyé';
        renderAnnaleFilePreview(prefix);
      }catch(err){
        annaleFileStates[prefix] = null;
        if(progWrap) progWrap.style.display='none';
        alert("Erreur d'envoi du fichier : " + (err && err.message ? err.message : err));
      }
    }
  );
}

function renderAnnaleFilePreview(prefix){
  const box = document.getElementById(prefix+'-an-file-preview');
  if(!box) return;
  const st = annaleFileStates[prefix];
  if(!st || !st.url){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='flex';
  box.innerHTML = `<span style="font-size:12.5px;font-weight:700;color:var(--ink)">${st.type==='image'?'🖼️':'📄'} ${esc(st.nom)}</span><button type="button" class="btn-mini" onclick="deleteAnnaleFileAttachment('${prefix}')">🗑️ Supprimer</button>`;
}

window.deleteAnnaleFileAttachment = function(prefix){
  const st = annaleFileStates[prefix];
  annaleFileStates[prefix] = null;
  const progWrap = document.getElementById(prefix+'-an-progress');
  if(progWrap) progWrap.style.display='none';
  renderAnnaleFilePreview(prefix);
  if(st && st.path && st.url){
    try{ window.fbDeleteObject(window.fbStorageRef(window.fbStorage, st.path)); }catch(e){}
  }
};

function annaleFileIsUploading(prefix){ const st = annaleFileStates[prefix]; return !!(st && st.uploading); }
function annaleFileHasContent(prefix){ const st = annaleFileStates[prefix]; return !!(st && st.url); }
function annaleFileGetData(prefix){ const st = annaleFileStates[prefix]; return st && st.url ? { url:st.url, nom:st.nom, type:st.type, path:st.path } : null; }
function resetAnnaleFileState(prefix){
  annaleFileStates[prefix] = null;
  const progWrap = document.getElementById(prefix+'-an-progress');
  if(progWrap) progWrap.style.display='none';
  renderAnnaleFilePreview(prefix);
}

window.profAjouterAnnale = async function(prefix){

window.adminAjouterAnnale = async function(prefix){
  await soumettreAnnale(prefix, { auteurNom: 'Administration', auteurRole:'admin', profCode: null });
};

async function soumettreAnnale(prefix, auteur){
  const matiere = (document.getElementById(prefix+'-an-matiere').value||'').trim();
  const niveau = (document.getElementById(prefix+'-an-niveau').value||'').trim();
  const annee = (document.getElementById(prefix+'-an-annee').value||'').trim();
  const titre = (document.getElementById(prefix+'-an-titre').value||'').trim();
  const description = (document.getElementById(prefix+'-an-desc').value||'').trim();
  if(annaleFileIsUploading(prefix)){ alert("L'envoi du fichier est encore en cours, patientez un instant."); return; }
  const fichier = annaleFileHasContent(prefix) ? annaleFileGetData(prefix) : null;
  if(!matiere){ alert('Veuillez choisir une matière.'); return; }
  if(!niveau){ alert('Veuillez indiquer le niveau.'); return; }
  if(!annee){ alert("Veuillez indiquer l'année."); return; }
  if(!titre){ alert('Veuillez donner un titre au sujet.'); return; }
  if(!fichier){ alert('Veuillez joindre le fichier du sujet (image ou PDF).'); return; }
  try{
    await window.fbAddDoc(window.fbCollection(window.fbDB,'edtxAnnales'), {
      matiere, niveau, annee, titre, description: description||'',
      fichierUrl: fichier.url, fichierNom: fichier.nom, fichierType: fichier.type, fichierPath: fichier.path,
      auteurNom: auteur.auteurNom, auteurRole: auteur.auteurRole, profCode: auteur.profCode||null,
      createdAt: Date.now()
    });
    ['an-matiere','an-niveau','an-annee','an-titre','an-desc'].forEach(k=>{ const el = document.getElementById(prefix+'-'+k); if(el) el.value=''; });
    resetAnnaleFileState(prefix);
  }catch(e){ alert('Erreur de publication : ' + (e && e.message ? e.message : e)); }
}

window.supprimerAnnale = async function(annaleId){
  if(!confirm('Supprimer définitivement cette annale ?')) return;
  const a = annalesCache.find(x=>x.id===annaleId);
  try{
    await window.fbDeleteDoc(window.fbDoc(window.fbDB,'edtxAnnales', annaleId));
    if(a && a.fichierPath){ try{ window.fbDeleteObject(window.fbStorageRef(window.fbStorage, a.fichierPath)); }catch(e){} }
  }catch(e){ alert('Erreur de suppression : ' + (e && e.message ? e.message : e)); }
};

function demarrerEcouteAnnales(prefix, extraMatiereSelectIds){

window.appliquerFiltresAnnales = function(prefix){
  const matiere = (document.getElementById(prefix+'-f-matiere')||{}).value || '';
  const niveau = ((document.getElementById(prefix+'-f-niveau')||{}).value || '').trim().toLowerCase();
  const annee = ((document.getElementById(prefix+'-f-annee')||{}).value || '').trim().toLowerCase();
  const filtered = annalesCache.filter(a=>
    (!matiere || a.matiere===matiere) &&
    (!niveau || (a.niveau||'').toLowerCase().includes(niveau)) &&
    (!annee || (a.annee||'').toLowerCase().includes(annee))
  );
  let peutSupprimerFn = ()=>false;
  if(prefix==='pr-an'){
    const s = getSession();
    peutSupprimerFn = (a)=> !!(s && s.role==='prof' && a.auteurRole==='prof' && a.profCode===s.code);
  } else if(prefix==='ad-an'){
    peutSupprimerFn = ()=>true;
  }
  renderAnnalesListe(filtered, prefix+'-list', { peutSupprimer: peutSupprimerFn });
};

function renderAnnalesListe(list, boxId, opts){
  opts = opts || {};

  if(!list.length){ box.innerHTML = `<div class="empty">📚 Aucune annale ne correspond à ces critères pour l'instant.</div>`; return; }
  const peutSupprimerFn = typeof opts.peutSupprimer === 'function' ? opts.peutSupprimer : ()=>false;
  box.innerHTML = list.map(a=>renderAnnaleItem(a, peutSupprimerFn(a))).join('');

function renderQItem(q, opts){
  const reponses = q.reponses || [];
  const answered = reponses.length>0;
  const prof = opts.prof;
  const peutRepondre = !opts.readonly && prof && (prof.matieres||[]).includes(q.matiere) ;
  const peutSupprimerEleve = opts.eleve && opts.eleve.role==='eleve' && opts.eleve.eleveNom === q.eleveNom;
  const peutSupprimer = peutRepondre || peutSupprimerEleve;
  const reponsesHtml = reponses.map(r=>`
    <div class="r-box">
      <div class="r-top"><span class="r-prof">🧑‍🏫 ${esc(r.profNom)}</span><span class="r-time">${fmtTime(r.createdAt)}</span></div>
      ${r.texte ? `<div class="r-text">${esc(r.texte)}</div>` : ''}
      ${r.dessin ? `<img class="r-dessin-img" src="${r.dessin}" alt="Dessin de réponse">` : ''}
      ${r.audio ? `<audio class="r-audio" controls src="${r.audio}"></audio>` : ''}
      ${r.fichier ? (r.fichier.type==='image'
        ? `<img class="r-dessin-img" src="${r.fichier.dataUrl}" alt="Pièce jointe">`
        : `<a class="r-fichier-link" href="${r.fichier.dataUrl}" download="${esc(r.fichier.nom)}">📄 ${esc(r.fichier.nom)}</a>`) : ''}
      ${r.video ? videoEmbedHtml(r.video.url, 'r-video') : ''}
    </div>`).join('');
  let ansFormHtml = '';
  if(peutRepondre){
    const ansPrefix = 'ans-'+q.id;
    ansFormHtml = `
      <div class="ans-form">
        ${composerHtml(ansPrefix,'Votre réponse...',{allowVideo:true})}
        <button class="btn btn-primary btn-block composer-send" onclick="profRepondre('${q.id}')">Répondre</button>
      </div>`;
  } else if(!opts.readonly && !answered){
    ansFormHtml = `<div class="q-lock-note">🔒 Réservé à un professeur de ${esc(q.matiere)}.</div>`;
  }
  return `
    <div class="q-item ${answered?'answered':''}">
      <div class="q-top"><span class="q-mat">${esc(q.matiere)}</span>${answered?'<span class="q-stamp">Répondu ✓</span>':''}<span class="q-time">${fmtTime(q.createdAt)}</span>${peutSupprimer?`<button type="button" class="q-del-btn" onclick="supprimerQuestion('${q.id}')" title="Supprimer cette question">🗑️</button>`:''}</div>
      <div class="q-eleve">🎒 ${esc(q.eleveNom)}</div>
      ${q.question ? `<div class="q-text">${esc(q.question)}</div>` : ''}
      ${q.dessin ? `<img class="q-dessin-img" src="${q.dessin}" alt="Dessin de la question">` : ''}
      ${q.audio ? `<audio class="q-audio" controls src="${q.audio}"></audio>` : ''}
      ${q.fichier ? (q.fichier.type==='image'
        ? `<img class="q-dessin-img" src="${q.fichier.dataUrl}" alt="Sujet joint">`
        : `<a class="q-fichier-link" href="${q.fichier.dataUrl}" download="${esc(q.fichier.nom)}">📄 ${esc(q.fichier.nom)}</a>`) : ''}
      ${reponsesHtml}
      ${ansFormHtml}
    </div>`;
}

window.profRepondre = async function(qId){
  const s = getSession();
  if(!s || s.role!=='prof') return;
  const prefix = 'ans-'+qId;
  const texte = (document.getElementById(prefix+'-text').value||'').trim();
  const dessin = canvasHasContent(prefix+'-canvas') ? canvasToDataURL(prefix+'-canvas') : null;
  const audio = audioHasContent(prefix) ? audioToDataURL(prefix) : null;
  const fichier = fileHasContent(prefix) ? fileGetData(prefix) : null;
  if(videoIsUploading(prefix)){ alert("L'envoi de la vidéo est encore en cours, patientez un instant."); return; }
  const video = videoHasContent(prefix) ? videoGetData(prefix) : null;
  if(!texte && !dessin && !audio && !fichier && !video){ alert('Veuillez écrire une réponse, faire un dessin, enregistrer un message vocal, joindre un fichier ou une vidéo.'); return; }
  try{
    const ref = window.fbDoc(window.fbDB,'edtxTableau', qId);
    const snap = await window.fbGetDoc(ref);
    if(!snap.exists()) return;
    const reponses = snap.data().reponses || [];
    reponses.push({ profNom: s.nom, profCode: s.code, texte: texte||'', dessin: dessin||null, audio: audio||null, fichier: fichier||null, video: video||null, createdAt: Date.now() });
    await window.fbUpdateDoc(ref, { reponses });
    resetAudioState(prefix);
    resetFileState(prefix);
    resetVideoState(prefix);
  }catch(e){ alert('Erreur : ' + (e && e.message ? e.message : e)); }
};

window.supprimerQuestion = async function(qId){
  if(!confirm('Supprimer définitivement cette question (et ses réponses éventuelles) ?')) return;
  try{
    await window.fbDeleteDoc(window.fbDoc(window.fbDB,'edtxTableau', qId));
  }catch(e){ alert('Erreur de suppression : ' + (e && e.message ? e.message : e)); }
};

// ═══════════════ Écoute temps réel du tableau d'une classe ═══════════════
function ecouterTableauClasse(classeId, cb){
  if(unsubBoard) unsubBoard();
  const qy = window.fbQuery(window.fbCollection(window.fbDB,'edtxTableau'), window.fbWhere('classeId','==',classeId));
  unsubBoard = window.fbOnSnapshot(qy, snap=>{
    const list = snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    cb(list);
  }, err=>console.warn('tableau listener error', err));
}

// ═══════════════ Mode hors-ligne : cache des vidéos/fiches déjà consultées ═══════════════
// Utilise le Cache Storage du navigateur (indépendant du Service Worker) pour enregistrer
// une copie locale de chaque vidéo/fiche au moment où elle est réellement ouverte/lue,
// afin d'économiser la donnée sur les connexions instables (Mamou) tout en permettant
// de revoir ce qui a déjà été consulté sans réseau.
const MEDIA_CACHE_NAME = 'edtx-media-v1';
const MEDIA_MAX_BYTES = 200 * 1024 * 1024; // 200 Mo max de contenu hors-ligne (le plus ancien est purgé au-delà)

function mediaIndexLoad(){ try{ return JSON.parse(localStorage.getItem('edtxMediaIndex')||'[]'); }catch(e){ return []; } }
function mediaIndexSave(idx){ try{ localStorage.setItem('edtxMediaIndex', JSON.stringify(idx)); }catch(e){} }
function mediaIndexTotal(idx){ return idx.reduce((s,e)=>s+(e.bytes||0),0); }

async function enforceMediaQuota(cache){
  const idx = mediaIndexLoad().sort((a,b)=>a.ts-b.ts); // le plus ancien d'abord
  while(mediaIndexTotal(idx) > MEDIA_MAX_BYTES && idx.length){
    const oldest = idx.shift();
    try{ await cache.delete(oldest.url); }catch(e){}
  }
  mediaIndexSave(idx);
}

async function cacheMediaUrl(url){
  if(!url || !('caches' in window)) return;
  if(url.startsWith('data:') || url.startsWith('blob:')) return;
  if(extractYouTubeId(url)) return; // vidéo YouTube : reste en streaming, pas de copie locale
  try{
    const cache = await caches.open(MEDIA_CACHE_NAME);
    if(await cache.match(url)) return;
    const resp = await fetch(url, { mode:'cors' });
    if(!resp || !resp.ok) return;
    await cache.put(url, resp.clone());
    const bytes = Number(resp.headers.get('content-length')) || 0;
    const idx = mediaIndexLoad();
    idx.push({ url, bytes, ts: Date.now() });
    mediaIndexSave(idx);
    await enforceMediaQuota(cache);
    markMediaBadge(url);
  }catch(e){ /* connexion instable : on retentera à la prochaine consultation */ }
}

function addOfflineBadge(el){
  const host = el.closest('.card') || el.parentElement;
  if(!host || host.querySelector('.media-offline-badge')) return;
  const badge = document.createElement('span');
  badge.className = 'media-offline-badge';
  badge.textContent = '📥 disponible hors-ligne';
  el.insertAdjacentElement('afterend', badge);
}
function markMediaBadge(url){
  document.querySelectorAll('[data-media-url]').forEach(el=>{ if(el.dataset.mediaUrl===url) addOfflineBadge(el); });
}

async function enhanceOfflineMedia(scope){
  if(!('caches' in window)) return;
  const els = (scope||document).querySelectorAll('[data-media-url]');
  if(!els.length) return;
  let cache; try{ cache = await caches.open(MEDIA_CACHE_NAME); }catch(e){ return; }
  for(const el of els){
    const url = el.dataset.mediaUrl, kind = el.dataset.mediaKind;
    const cached = await cache.match(url).catch(()=>null);
    if(cached){
      addOfflineBadge(el);
      if(!navigator.onLine){
        try{
          const blobUrl = URL.createObjectURL(await cached.blob());
          if(kind==='video'){ el.src = blobUrl; }
          else if(kind==='image'){ el.href = blobUrl; const img = el.querySelector('img'); if(img) img.src = blobUrl; }
          else { el.href = blobUrl; }
        }catch(e){}
      }
    } else if(kind==='image' && navigator.onLine){
      // La vignette de la fiche est de toute façon déjà téléchargée pour l'aperçu : autant la
      // garder hors-ligne, sans coût de donnée supplémentaire.
      cacheMediaUrl(url);
    }
  }
}

// Mise en cache déclenchée par la consultation réelle : lecture d'une vidéo, ouverture d'une fiche/PDF
document.addEventListener('play', (e)=>{
  const t = e.target;
  if(t && t.tagName==='VIDEO' && t.dataset && t.dataset.mediaUrl) cacheMediaUrl(t.dataset.mediaUrl);
}, true);
document.addEventListener('click', (e)=>{
  const a = e.target.closest && e.target.closest('[data-media-url][data-media-kind="file"]');
  if(a) cacheMediaUrl(a.dataset.mediaUrl);
}, true);

// Bannière « hors-ligne » + bascule des médias déjà en cache vers leur copie locale
function updateOfflineBanner(){
  const banner = document.getElementById('offline-banner');
  if(!banner) return;
  banner.style.display = navigator.onLine ? 'none' : 'block';
  if(!navigator.onLine) enhanceOfflineMedia(document);
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);
updateOfflineBanner();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
